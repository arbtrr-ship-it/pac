name: CI

on:
  pull_request:

jobs:
  js-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JS syntax
        run: node --check js/*.js

  secrets-presence:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets are configured
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set +x
          missing=0
          for name in NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            else
              echo "$name: configured"
            fi
          done
          exit $missing
